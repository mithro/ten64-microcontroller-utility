name: Debian Package + apt repo

# Build the Ten64 microcontroller utility (ten64-controller) as an arm64 .deb and
# publish it as a signed flat apt repository on GitHub Pages
# (https://mithro.github.io/ten64-microcontroller-utility/). Mirrors the pattern
# used by other mithro apt-repo projects (dtbocfg, netplan).

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

# Least privilege by default: only the publish job below raises this, and only
# for itself. The build jobs run Docker and clone third-party sources, so they
# should never hold a token that can write to Pages.
permissions:
  contents: read

jobs:
  build-deb:
    name: deb (${{ matrix.suite }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, sid]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build arm64 package in debian:${{ matrix.suite }}
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          docker run --rm \
            -v "${PWD}:/src" -w /src \
            "docker.io/library/debian:$SUITE" \
            sh packaging/ci-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.suite }}
          path: built-debs/
          if-no-files-found: error

  publish-apt:
    # Scoped to this job alone. A job calling a reusable workflow sets the
    # maximum permissions available to it, so the elevated Pages scopes stay
    # here rather than applying to the whole workflow.
    permissions:
      contents: read
      pages: write
      id-token: write
    # Build on PRs to validate, but never publish from one.
    if: github.event_name != 'pull_request'
    needs: build-deb
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
    with:
      suites: "trixie sid"
      architectures: "arm64"
      origin: ten64-microcontroller-utility
      description: "Traverse Ten64 microcontroller utility"
      keyring-name: ten64-controller.gpg
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
